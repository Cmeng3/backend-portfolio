expose_php=Off
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
upload_max_filesize=10M
post_max_size=12M
memory_limit=96M
opcache.enable=1
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.jit_buffer_size=0
opcache.validate_timestamps=0
