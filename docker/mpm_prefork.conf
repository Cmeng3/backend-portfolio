# Conservative starting point for a single 512 MB API container.
# Each Apache child embeds PHP; avoid the distribution's much larger pool.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 1
    MaxSpareServers 2
    ServerLimit 2
    MaxRequestWorkers 2
    MaxConnectionsPerChild 500
</IfModule>

KeepAlive On
KeepAliveTimeout 1
MaxKeepAliveRequests 100
